services:
  db: 
    image: postgres:18
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: modmapper
    ports:
      - "127.0.0.1:5432:5432" # host_ip:host_port:container_port
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d modmapper"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: